name: Benchmark

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Install both the full Chromium browser and the dedicated
      # chrome-headless-shell binary. Playwright 1.49+ launches via
      # chrome-headless-shell when `headless: true` is set, so installing
      # only `chromium` leaves the launch call looking at an empty
      # cache directory (see 2026-11-15 gotcha).
      - run: npx playwright install --with-deps chromium chromium-headless-shell

      - run: pnpm --filter @sfysh/benchmark bench

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmark/results/*.json
