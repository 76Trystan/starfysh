# Release workflow: publishes @sfysh/* packages via npm Trusted Publishing (OIDC).
#
# Prerequisite (one-off, done on npmjs.com):
#   For each of @sfysh/ir, @sfysh/compiler, @sfysh/runtime, @sfysh/playwright-adapter:
#     Settings -> Trusted Publishers -> add this repository (76Trystan/starfysh),
#     workflow (.github/workflows/release.yml), environment (none).
#   Until all four are configured, this workflow will fail with 404/EOIDC on publish.
#   See docs/planning/Blockers.md for the history of why this replaced NPM_TOKEN auth.
#
# After configuration, every merge of a "Version Packages" PR auto-publishes with
# build provenance attached, no secrets stored in the repo.

name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # pnpm 9.x delegates provenance signing to the npm CLI it shells out to.
      # Node 22 LTS ships with npm 10.x; upgrade to the latest npm so OIDC
      # token exchange and --provenance are both supported.
      - name: Upgrade npm for OIDC and provenance
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
